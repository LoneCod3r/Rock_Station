<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RockStation — Your Station. Your Rock.</title>
<meta name="description" content="RockStation — 24/7 live rock radio: Rock, Metal, Gothic, Synthwave and Alternative from free internet stations.">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="backdrop"></div>

<!-- ===== SITE HEADER ===== -->
<header class="site-header">
  <div class="logo">
    <img class="logo-icon" src="images/favicon.png" width="28" height="28" alt="">
    <div class="logo-word">Rock<span>Station</span></div>
  </div>
  <div class="header-title header-eq" aria-label="Now playing" role="img">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <h1 class="tagline">24/7 ROCK MUSIC. <span>NON-STOP.</span></h1>
</header>

<!-- ===== GENRES ===== -->
<section class="genre-strip">
  <div class="section-label">GENRES</div>
  <nav class="genre-tabs" id="genre-tabs" aria-label="Genres">
    <!-- filled by app.js -->
  </nav>
</section>

<!-- ===== STATIONS + PLAYER ===== -->
<div class="section-label stations-label"><span id="log-genre">—</span></div>

<main class="player-grid">

  <div class="stations-flank" id="stations-flank-left"></div>

  <div class="phone-column">

  <div class="phone-frame">
    <div class="phone-notch"></div>
    <span class="phone-btn phone-btn--power"></span>
    <span class="phone-btn phone-btn--vol-a"></span>
    <span class="phone-btn phone-btn--vol-b"></span>

    <section class="now-playing">
      <div class="card-actions">
        <button class="icon-btn" id="favorite-btn" aria-label="Add to favorites" aria-pressed="false">
          <svg id="favorite-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2"><path d="M12 21s-6.7-4.35-9.5-8.1C.6 10 1.1 6.6 3.8 5.1 6 3.9 8.4 4.6 10 6.3l2 2.1 2-2.1c1.6-1.7 4-2.4 6.2-1.2 2.7 1.5 3.2 4.9 1.3 7.8C18.7 16.65 12 21 12 21z"/></svg>
        </button>
        <button class="icon-btn" id="share-btn" aria-label="Copy share link">
          <svg id="share-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
          <svg id="check-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7cb518" stroke-width="2.5" style="display:none"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
      </div>

      <div class="art-ring" id="art-ring">
        <div class="art-core">
          <img id="art-img" class="art-img" alt="" style="display:none">
          <div id="art-fallback" class="art-fallback">
            <svg width="40" height="40" viewBox="0 0 64 64" fill="none">
              <path d="M14 22c11-13 25-13 36 0" stroke="#e2132d" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
              <path d="M20 26c7-8 17-8 24 0" stroke="#e2132d" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
              <path d="M35 30L16 54h11l-4 20 23-28H35z" fill="#e2132d"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="on-air" id="on-air">ON AIR</div>
      <h2 class="station-name" id="lcd-station">SELECT A GENRE</h2>
      <div class="station-sub" id="lcd-genre">—</div>
      <div class="station-meta" id="station-meta"></div>

      <div class="transport">
        <button class="skip-btn" id="prev-btn" aria-label="Previous station">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#f2f2f2"><path d="M6 6h2v12H6zM20 6L10 12l10 6z"/></svg>
        </button>
        <button class="play-btn" id="play-btn" aria-label="Play or stop">
          <svg id="play-icon" width="19" height="19" viewBox="0 0 24 24" fill="#f2f2f2"><path d="M8 5v14l11-7z"/></svg>
          <svg id="stop-icon" width="16" height="16" viewBox="0 0 24 24" fill="#f2f2f2" style="display:none"><rect x="5" y="5" width="14" height="14"/></svg>
        </button>
        <button class="skip-btn" id="next-btn" aria-label="Next station">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#f2f2f2"><path d="M16 6h2v12h-2zM4 6l10 6-10 6z"/></svg>
        </button>
      </div>

      <div class="volume-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#9a9a9a"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
        <input type="range" id="volume-range" min="0" max="100" value="70" aria-label="Volume">
      </div>
    </section>

    <div class="phone-home-bar"></div>
  </div>

  </div>

  <div class="stations-flank" id="stations-flank-right"></div>

</main>

<footer class="app-footer">ROCK LIVES HERE! · FREE 24/7 INTERNET RADIO · Made by <a href="https://lonecoder.nsh.one" target="_blank" rel="noopener">Lone Coder</a></footer>

<audio id="player" preload="none"></audio>

<script src="app.js"></script>
</body>
</html>
