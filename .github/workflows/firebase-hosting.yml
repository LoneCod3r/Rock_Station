name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once; let an in-progress deploy finish.
concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs can be started from any branch; only main may reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The site is plain static files in public/ (no package.json), so the
      # Firebase CLI is the only dependency.
      - run: npm install -g firebase-tools@15

      # Service-account JSON from the repository secret; exposed to the CLI via
      # GOOGLE_APPLICATION_CREDENTIALS and removed again when the job ends.
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROCKSTATION }}

      # Hosting only, to the existing rockstation project/site (as in .firebaserc).
      - run: firebase deploy --only hosting --project rockstation --non-interactive
